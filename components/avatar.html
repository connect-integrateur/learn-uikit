<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<!--
  Avatar
  Représentation visuelle d'un utilisateur : image, initiales ou icône.
-->

<!-- Taille : petite -->
<figure aria-label="Jeanne Dupont">
  <img src="../assets/avatar.svg" alt="">
</figure>

<!-- Avec initiales au lieu d'une image -->
<figure aria-label="Jeanne Dupont">
  <abbr title="Jeanne Dupont">JD</abbr>
</figure>

<!-- Taille : normale (par défaut) -->
<figure aria-label="Jeanne Dupont">
  <img src="../assets/avatar.svg" alt="">
</figure>

<!-- Taille : grande -->
<figure aria-label="Jeanne Dupont">
  <img src="../assets/avatar.svg" alt="">
</figure>


<!-- ===== Groupe d'avatars (avatars qui se chevauchent) ===== -->

<!-- Groupe : petite taille -->
<figure role="group" aria-label="Membres de l'équipe">
  <figure aria-label="Jeanne Dupont">
    <img src="../assets/avatar.svg" alt="">
  </figure>
  <figure aria-label="Jean Martin">
    <img src="../assets/avatar.svg" alt="">
  </figure>
  <figure aria-label="Alex Bernard">
    <img src="../assets/avatar.svg" alt="">
  </figure>
</figure>

<!-- Groupe : taille normale -->
<figure role="group" aria-label="Membres de l'équipe">
  <figure aria-label="Jeanne Dupont">
    <img src="../assets/avatar.svg" alt="">
  </figure>
  <figure aria-label="Jean Martin">
    <img src="../assets/avatar.svg" alt="">
  </figure>
  <figure aria-label="Alex Bernard">
    <img src="../assets/avatar.svg" alt="">
  </figure>
</figure>

<!-- Groupe : grande taille -->
<figure role="group" aria-label="Membres de l'équipe">
  <figure aria-label="Jeanne Dupont">
    <img src="../assets/avatar.svg" alt="">
  </figure>
  <figure aria-label="Jean Martin">
    <img src="../assets/avatar.svg" alt="">
  </figure>
  <figure aria-label="Alex Bernard">
    <img src="../assets/avatar.svg" alt="">
  </figure>
</figure>

</body>
</html>
