<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Info-bulle</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<!--
  Info-bulle
  L'attribut natif title affiche une info-bulle au survol. Les images doivent être placées dans un parent qui porte le title. Positions possibles : haut (par défaut), bas, gauche, droite.
-->

<button title="Enregistrer vos modifications">Enregistrer</button>

<!-- Variante : danger -->
<button title="Supprimer cet élément">Supprimer</button>

<a href="#" title="Voir votre profil">Profil</a>

<span title="Les images ont besoin d'un parent avec un title"><img src="../assets/avatar.svg" height="32" alt=""></span>


<!-- ===== Positions ===== -->

<!-- Position : haut (par défaut) -->
<button title="Au-dessus">Haut</button>

<!-- Position : bas -->
<button title="En dessous">Bas</button>

<!-- Position : gauche -->
<button title="À gauche">Gauche</button>

<!-- Position : droite -->
<button title="À droite">Droite</button>

</body>
</html>
