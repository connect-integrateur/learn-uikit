<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<!--
  Carte
  Conteneur de type carte avec l'élément sémantique <article>.
-->

<article>
  <header>
    <h3>Titre de la carte</h3>
    <p>La description de la carte.</p>
  </header>
  <p>Le contenu de la carte. Il peut contenir n'importe quel HTML.</p>
  <footer>
    <!-- Style : contour -->
    <button>Annuler</button>
    <button>Enregistrer</button>
  </footer>
</article>

</body>
</html>
