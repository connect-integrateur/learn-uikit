<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squelette de chargement</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<!--
  Squelette de chargement
  Formes grises (souvent animées) affichées à la place du contenu pendant son chargement.
-->

<!-- Variante : ligne de texte -->
<div role="status" aria-label="Chargement"></div>

<!-- Variante : boîte (image) -->
<div role="status" aria-label="Chargement"></div>


<!-- ===== Carte squelette ===== -->
<article>
  <!-- Variante : boîte -->
  <div role="status" aria-label="Chargement"></div>
  <div>
    <!-- Variante : ligne -->
    <div role="status" aria-label="Chargement"></div>
    <!-- Variante : ligne plus courte (60 %) -->
    <div role="status" aria-label="Chargement"></div>
  </div>
</article>

</body>
</html>
