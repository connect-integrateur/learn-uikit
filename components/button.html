<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bouton</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<!--
  Bouton
  Variantes, styles, tailles et groupe de boutons.
-->

<!-- ===== Variantes et styles ===== -->

<!-- Variante : principal (par défaut) -->
<button>Principal</button>

<!-- Variante : secondaire -->
<button>Secondaire</button>

<!-- Variante : danger -->
<button>Danger</button>

<!-- Style : contour (outline) -->
<button>Contour</button>

<!-- Variante : danger + style contour -->
<button>Danger</button>

<!-- Style : fantôme (ghost, sans fond ni bordure) -->
<button>Fantôme</button>

<!-- État désactivé : style contour -->
<button disabled>Désactivé</button>

<!-- État désactivé : variante danger -->
<button disabled>Désactivé</button>

<!-- État désactivé : par défaut -->
<button disabled>Désactivé</button>


<!-- ===== Tailles ===== -->

<!-- Taille : petite -->
<button>Petit</button>

<!-- Taille : normale (par défaut) -->
<button>Normal</button>

<!-- Taille : grande -->
<button>Grand</button>

<!-- Un lien qui a l'apparence d'un bouton -->
<a href="#">Lien</a>


<!-- ===== Groupe de boutons (boutons accolés) ===== -->
<!-- Style : contour pour chaque bouton -->
<menu>
  <li><button>Gauche</button></li>
  <li><button>Centre</button></li>
  <li><button>Droite</button></li>
</menu>

</body>
</html>
