<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alerte</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<!--
  Alerte
  Messages d'alerte avec role="alert". Variantes : info (par défaut), succès, avertissement, erreur.
-->

<!-- Variante : succès -->
<div role="alert">
  <strong>Succès !</strong> Vos modifications ont été enregistrées.
</div>

<!-- Variante : avertissement -->
<div role="alert">
  <strong>Attention !</strong> Merci de vérifier avant de continuer.
</div>

<!-- Variante : info (par défaut) -->
<div role="alert">
  <strong>Info</strong> Ceci est un message d'alerte par défaut.
</div>

<!-- Variante : erreur -->
<div role="alert">
  <strong>Erreur !</strong> Une erreur est survenue.
</div>

</body>
</html>
