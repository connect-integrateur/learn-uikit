<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jauge</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<!--
  Jauge
  Mesure d'une valeur dans un intervalle connu avec l'élément natif <meter>. Le navigateur change la couleur selon les attributs low, high et optimum.
-->

<!-- Valeur bonne -->
<meter value="0.8" min="0" max="1" low="0.3" high="0.7" optimum="1"></meter>

<!-- Valeur moyenne -->
<meter value="0.5" min="0" max="1" low="0.3" high="0.7" optimum="1"></meter>

<!-- Valeur faible -->
<meter value="0.2" min="0" max="1" low="0.3" high="0.7" optimum="1"></meter>

</body>
</html>
